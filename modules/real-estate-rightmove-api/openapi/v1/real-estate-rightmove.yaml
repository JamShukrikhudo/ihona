openapi: 3.1.0
info: {title: Real Estate Rightmove Sync API, version: 1.0.0}
security: [{sanctum: []}]
x-liberu-idempotency-header: Idempotency-Key
paths:
  /api/v1/real-estate/integrations/rightmove/syncs:
    get: {operationId: real.estate.rightmove.list, summary: List Rightmove syncs, responses: {'200': {description: OK}}}
    post: {operationId: real.estate.rightmove.create, responses: {'201': {description: Created}}}
  /api/v1/real-estate/integrations/rightmove/syncs/{rightmoveSync}:
    post: {operationId: real.estate.rightmove.sync, summary: Synchronize a Rightmove listing, responses: {'200': {description: Synchronized}}}
    get: {operationId: real.estate.rightmove.get, summary: Show a Rightmove sync, responses: {'200': {description: OK}}}
    patch: {operationId: real.estate.rightmove.update, summary: Update a Rightmove sync, responses: {'200': {description: OK}}}
    delete: {operationId: real.estate.rightmove.delete, summary: Archive a Rightmove sync, responses: {'204': {description: Archived}}}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}
  schemas:
    Error: {type: object, required: [message], properties: {message: {type: string}, code: {type: string}, errors: {type: object, additionalProperties: true}}}
    PaginationMeta: {type: object, required: [current_page, per_page, total, last_page], properties: {current_page: {type: integer}, per_page: {type: integer}, total: {type: integer}, last_page: {type: integer}}}
