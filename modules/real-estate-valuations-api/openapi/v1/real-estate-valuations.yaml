openapi: 3.1.0
info: {title: Real Estate Valuations API, version: 1.0.0}
paths:
  /api/v1/real-estate/valuations:
    get: {operationId: real.estate.valuations.list, responses: {"200": {description: Authorized valuations}}}
    post: {operationId: real.estate.valuations.create, responses: {"201": {description: Created valuation}}}
  /api/v1/real-estate/valuations/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get: {operationId: real.estate.valuations.get, responses: {"200": {description: Valuation}}}
    patch: {operationId: real.estate.valuations.update, responses: {"200": {description: Updated valuation}}}
    delete: {operationId: real.estate.valuations.delete, responses: {"204": {description: Deleted valuation}}}
  /api/v1/real-estate/valuations/{id}/schedule:
    post:
      operationId: real.estate.valuations.schedule
      security: [{sanctum: []}]
      responses: {'200': {description: Valuation scheduled}}
  /api/v1/real-estate/valuations/{id}/complete:
    post:
      operationId: real.estate.valuations.complete
      security: [{sanctum: []}]
      responses: {'200': {description: Valuation completed}}
  /api/v1/real-estate/valuations/{id}/convert:
    post:
      operationId: real.estate.valuations.convert
      security: [{sanctum: []}]
      responses: {'200': {description: Valuation converted}}
  /api/v1/real-estate/valuations/{id}/comparables:
    post:
      operationId: real.estate.valuations.comparables
      security: [{sanctum: []}]
      responses: {'200': {description: Comparable pricing calculated}}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}
