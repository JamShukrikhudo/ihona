openapi: 3.1.0
info:
  title: Real Estate Core API
  version: 1.0.0
x-liberu-idempotency-header: Idempotency-Key
paths:
  /api/v1/real-estate/branches:
    get:
      operationId: real.estate.branches.list
      security: [{sanctum: []}]
      responses: {'200': {description: Authorized branch collection}}
    post:
      operationId: real.estate.branches.create
      security: [{sanctum: []}]
      responses: {'201': {description: Branch created}}
  /api/v1/real-estate/branches/{id}:
    get:
      operationId: real.estate.branches.get
      security: [{sanctum: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Authorized branch}}
    patch:
      operationId: real.estate.branches.update
      security: [{sanctum: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Branch updated}}
    delete:
      operationId: real.estate.branches.delete
      security: [{sanctum: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'204': {description: Branch archived}}
  /api/v1/real-estate/agencies:
    get:
      operationId: real.estate.agencies.list
      security: [{sanctum: []}]
      responses: {'200': {description: Authorized agency collection}}
    post:
      operationId: real.estate.agencies.create
      security: [{sanctum: []}]
      responses: {'201': {description: Agency created}}
  /api/v1/real-estate/agencies/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get: {operationId: real.estate.agencies.get, security: [{sanctum: []}], responses: {'200': {description: Authorized agency}}}
    patch: {operationId: real.estate.agencies.update, security: [{sanctum: []}], responses: {'200': {description: Agency updated}}}
    delete: {operationId: real.estate.agencies.delete, security: [{sanctum: []}], responses: {'204': {description: Agency archived}}}
  /api/v1/real-estate/territories:
    get:
      operationId: real.estate.territories.list
      security: [{sanctum: []}]
      responses: {'200': {description: Authorized territory collection}}
    post:
      operationId: real.estate.territories.create
      security: [{sanctum: []}]
      responses: {'201': {description: Territory created}}
  /api/v1/real-estate/territories/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get: {operationId: real.estate.territories.get, security: [{sanctum: []}], responses: {'200': {description: Authorized territory}}}
    patch: {operationId: real.estate.territories.update, security: [{sanctum: []}], responses: {'200': {description: Territory updated}}}
    delete: {operationId: real.estate.territories.delete, security: [{sanctum: []}], responses: {'204': {description: Territory archived}}}
components:
  securitySchemes:
    sanctum: {type: http, scheme: bearer, bearerFormat: Sanctum}
  schemas:
    Error: {type: object, required: [message], properties: {message: {type: string}, code: {type: string}, errors: {type: object, additionalProperties: true}}}
    PaginationMeta: {type: object, required: [current_page, per_page, total, last_page], properties: {current_page: {type: integer}, per_page: {type: integer}, total: {type: integer}, last_page: {type: integer}}}
